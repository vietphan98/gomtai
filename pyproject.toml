[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gomtai"
version = "0.1.0"
description = "Trình quản lý tải file: hàng đợi song song, tạm dừng/tiếp tục, tự xếp thư mục, giao diện web nhỏ."
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["flask>=2.2"]
[project.optional-dependencies]
dev = ["pytest"]
[project.scripts]
gomtai = "gomtai.cli:main"
[tool.setuptools]
packages = ["gomtai"]
[tool.setuptools.package-data]
gomtai = ["templates/*.html"]
